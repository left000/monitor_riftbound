name: Monitor Riftbound Stock

on:
  schedule:
    # Esegue lo script automaticamente ogni 4 ore
    - cron: '0 */4 * * *'
  workflow_dispatch: # Ti permette di farlo partire anche a mano con un click

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v3

      - name: Configurazione di Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          pip install requests beautifulsoup4

      - name: Esecuzione dello script di monitoraggio
        run: python monitor.py